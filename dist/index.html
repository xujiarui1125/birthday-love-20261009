<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f0915">
  <meta name="description" content="写给老婆的一封生日情书。">
  <title>老婆，生日快乐</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23130a18'/%3E%3Cpath d='M32 51S12 39 12 24c0-11 13-14 20-5 7-9 20-6 20 5 0 15-20 27-20 27Z' fill='%23e5587b'/%3E%3Ccircle cx='47' cy='15' r='3' fill='%23efcc9c'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme:dark; --ink:#281923; --wine:#8f2949; --rose:#e5587b; --gold:#dcb67e; --paper:#fff9f2; }
    * { box-sizing:border-box; }
    html,body { width:100%;min-height:100%;margin:0; }
    body { min-height:100dvh;overflow:hidden;color:#fceef2;background:#0d0811;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none; }
    body::before { content:"";position:fixed;inset:-10%;z-index:-3;background:radial-gradient(ellipse at 18% 32%,rgba(126,24,62,.5),transparent 30%),radial-gradient(ellipse at 84% 10%,rgba(83,33,91,.3),transparent 25%),radial-gradient(ellipse at 72% 92%,rgba(121,38,58,.26),transparent 32%),linear-gradient(135deg,#09060d 0%,#1e0b17 54%,#110a1d 100%);animation:aurora 14s ease-in-out infinite alternate; }
    body::after { content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.25;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");mix-blend-mode:soft-light; }
    canvas { position:fixed;inset:0;width:100%;height:100%;pointer-events:none; }
    #garden { z-index:-2; } #touchTrail { z-index:8; }
    .stage { width:100%;min-height:100dvh;display:grid;grid-template-columns:minmax(280px,.86fr) minmax(360px,1.14fr);align-items:center;gap:clamp(18px,4vw,72px);padding:max(26px,env(safe-area-inset-top)) max(28px,env(safe-area-inset-right)) max(26px,env(safe-area-inset-bottom)) max(28px,env(safe-area-inset-left)); }
    .portrait { position:relative;min-height:min(76vh,720px);display:grid;place-items:center;opacity:0;animation:softIn 1.2s .15s ease forwards; }
    .heart-window { position:relative;width:min(38vw,470px);aspect-ratio:1;display:grid;place-items:center; }
    .heart-window::before,.heart-window::after { content:"";position:absolute;border-radius:50%;pointer-events:none; }
    .heart-window::before { inset:2%;border:1px solid rgba(240,187,202,.11);box-shadow:0 0 90px rgba(213,48,99,.17),inset 0 0 80px rgba(204,66,104,.08);animation:orbit 24s linear infinite; }
    .heart-window::after { inset:14%;background:radial-gradient(circle,rgba(223,65,112,.13),transparent 68%);filter:blur(12px);animation:breathe 4.6s ease-in-out infinite; }
    .orbit-mark { position:absolute;inset:0;animation:orbit 18s linear infinite reverse; }
    .orbit-mark::before,.orbit-mark::after { content:"✦";position:absolute;color:var(--gold);text-shadow:0 0 14px rgba(236,198,140,.8); }
    .orbit-mark::before { left:9%;top:30%;font-size:12px; } .orbit-mark::after { right:12%;bottom:21%;font-size:8px; }
    .small-note { position:absolute;bottom:5%;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;margin:0;text-align:center;color:rgba(255,230,237,.58);font:400 .75rem/1.7 system-ui,sans-serif;letter-spacing:.18em; }
    .small-note span { display:block;color:rgba(225,187,141,.7);font-size:.66rem;letter-spacing:.28em; }
    .letter-wrap { position:relative;width:min(100%,700px);justify-self:center;opacity:0;transform:translateY(22px) rotate(.4deg);animation:letterArrive 1.15s .38s cubic-bezier(.2,.78,.25,1) forwards; }
    .letter-wrap::before { content:"";position:absolute;z-index:-1;inset:24px -16px -18px 22px;border-radius:8px;background:#b97a83;opacity:.2;transform:rotate(-2.2deg);filter:blur(.2px); }
    .letter { position:relative;overflow:hidden;min-height:min(78vh,720px);display:flex;flex-direction:column;justify-content:center;padding:clamp(48px,7vh,82px) clamp(34px,7vw,88px) clamp(42px,6vh,70px);color:var(--ink);background:linear-gradient(rgba(255,255,255,.44),rgba(255,255,255,.08)),repeating-linear-gradient(0deg,transparent 0 31px,rgba(132,75,88,.055) 31px 32px),var(--paper);border:1px solid rgba(255,255,255,.64);border-radius:4px 18px 7px 13px;box-shadow:0 38px 100px rgba(0,0,0,.5),0 4px 20px rgba(0,0,0,.2),inset 0 0 70px rgba(164,96,76,.055); }
    .letter::before { content:"";position:absolute;inset:17px;border:1px solid rgba(132,50,71,.13);border-radius:3px 12px 4px 8px;pointer-events:none; }
    .letter::after { content:"♥";position:absolute;right:clamp(22px,5vw,54px);bottom:clamp(22px,5vw,46px);color:rgba(143,41,73,.075);font:700 clamp(5rem,14vw,10rem)/1 Georgia,serif;transform:rotate(-12deg); }
    .seal { position:absolute;z-index:2;top:0;right:clamp(30px,7vw,75px);width:72px;height:72px;transform:translateY(-42%) rotate(8deg);display:grid;place-items:center;border-radius:50%;color:#ffe3d2;font:700 29px/1 Georgia,serif;background:radial-gradient(circle at 34% 28%,#db6e76,#9f2c4a 58%,#701a37 100%);border:2px solid rgba(255,213,183,.35);box-shadow:0 8px 22px rgba(51,7,24,.4),inset 0 2px 5px rgba(255,255,255,.3);animation:sealIn .8s 1.15s cubic-bezier(.2,1.4,.4,1) both; }
    .seal::after { content:"";position:absolute;inset:8px;border:1px dashed rgba(255,226,207,.46);border-radius:50%; }
    .kicker { margin:0 0 23px;color:var(--wine);font:600 .73rem/1.5 system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase; }
    h1 { margin:0 0 18px;color:#3a1d2b;font-size:clamp(2.35rem,5.3vw,5rem);line-height:1.13;font-weight:700;letter-spacing:.06em; }
    h1 .accent { display:block;color:var(--wine);font-size:.6em;margin-top:7px;letter-spacing:.16em; }
    .rule { width:100%;height:1px;margin:11px 0 24px;background:linear-gradient(90deg,var(--wine),rgba(143,41,73,.17) 72%,transparent);transform-origin:left;animation:writeRule 1.1s 1.25s ease both; }
    .message { margin:0;max-width:540px;color:#553441;font-size:clamp(1.08rem,2vw,1.34rem);line-height:2.05;letter-spacing:.075em; }
    .message .forever { color:var(--wine);font-weight:700; }
    .message span { opacity:0;animation:lineIn .8s ease forwards; }
    .message span:nth-child(1){animation-delay:1.15s}.message span:nth-child(2){animation-delay:1.65s}.message span:nth-child(3){animation-delay:2.15s}
    .signature { position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:clamp(24px,5vh,50px); }
    .date { margin:0;color:#785261;font:500 .86rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em; }
    .mini-heart { color:var(--wine);font:400 28px/1 Georgia,serif;animation:pulse 1.8s ease-in-out infinite; }
    .mobile-hint { display:none; }
    @keyframes aurora { to{transform:translate3d(-2%,1.5%,0) scale(1.05)} } @keyframes softIn { to{opacity:1} } @keyframes letterArrive { to{opacity:1;transform:translateY(0) rotate(.4deg)} } @keyframes sealIn { from{opacity:0;transform:translateY(-42%) rotate(-25deg) scale(.3)} } @keyframes lineIn { from{opacity:0;filter:blur(4px);transform:translateY(7px)} to{opacity:1;filter:none;transform:none} } @keyframes writeRule { from{transform:scaleX(0)} } @keyframes orbit { to{transform:rotate(360deg)} } @keyframes breathe { 0%,100%{transform:scale(.86);opacity:.55} 50%{transform:scale(1.12);opacity:1} } @keyframes pulse { 0%,100%{transform:scale(1)} 24%{transform:scale(1.22)} 42%{transform:scale(.98)} }
    @media (max-width:760px) {
      body { overflow:hidden; } .stage { display:block;padding:0;min-height:100dvh; } .portrait { position:fixed;inset:0;min-height:0;opacity:.65; } .heart-window { width:128vw;max-width:none;transform:translate(-28%,-31%); } .small-note,.orbit-mark { display:none; }
      .letter-wrap { width:100%;min-height:100dvh;display:grid;place-items:center;padding:max(34px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(42px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); }
      .letter-wrap::before { inset:58px 9px 24px 29px; } .letter { width:100%;min-height:0;padding:clamp(55px,9vh,80px) clamp(30px,8vw,48px) clamp(38px,6vh,54px);border-radius:3px 13px 5px 10px; }
      .seal { right:38px;top:34px;width:62px;height:62px;font-size:25px; } .kicker { margin-bottom:19px;font-size:.69rem; } h1 { font-size:clamp(2.25rem,11.3vw,3.6rem);margin-bottom:15px; }
      .message { font-size:clamp(1.06rem,4.6vw,1.28rem);line-height:1.95; } .signature { margin-top:28px; }
      .mobile-hint { display:block;position:fixed;z-index:7;left:50%;bottom:max(11px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;margin:0;color:rgba(255,234,239,.66);font:400 .7rem/1.4 system-ui,sans-serif;letter-spacing:.14em;animation:hintAway 7s both;pointer-events:none; }
    }
    @media (max-height:620px) and (max-width:760px) { .letter-wrap{padding-top:20px;padding-bottom:24px}.letter{padding-top:43px;padding-bottom:30px}.seal{top:23px}.kicker{margin-bottom:12px}h1{font-size:2rem;margin-bottom:10px}.rule{margin:7px 0 13px}.message{font-size:1rem;line-height:1.72}.signature{margin-top:14px} }
    @keyframes hintAway { 0%,10%{opacity:0} 20%,72%{opacity:1} 100%{opacity:0} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms!important;animation-iteration-count:1!important; } }
  </style>
</head>
<body>
  <canvas id="garden" aria-hidden="true"></canvas>
  <main class="stage">
    <section class="portrait" aria-hidden="true"><div class="heart-window"><i class="orbit-mark"></i></div><p class="small-note">每一次心动，都是因为你<span>LOVE, IN EVERY MOMENT</span></p></section>
    <div class="letter-wrap"><i class="seal" aria-hidden="true">♥</i><article class="letter" aria-label="写给老婆的生日祝福">
      <p class="kicker">A LETTER FOR MY LOVE</p>
      <h1>老婆，生日快乐！<span class="accent">今天，也要永远幸福</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="message"><span class="forever">永远爱你！</span><br><span>希望你天天开心，</span><br><span>身体健康。</span></p>
      <footer class="signature"><p class="date">2026.10.09</p><span class="mini-heart" aria-hidden="true">♥</span></footer>
    </article></div>
  </main>
  <p class="mobile-hint">用指尖写下心动</p>
  <canvas id="touchTrail" aria-hidden="true"></canvas>
  <script>
    (()=>{
      const garden=document.querySelector('#garden'),trail=document.querySelector('#touchTrail'),g=garden.getContext('2d'),t=trail.getContext('2d');
      const dots=[],floaters=[],sparks=[],active=new Map(),palette=['#e5587b','#f390ad','#ffd2dd','#dfb476','#ffffff'];
      let w=0,h=0,dpr=1,then=performance.now(),heartOrigin={x:0,y:0},heartScale=1;
      const heartPoint=a=>({x:16*Math.sin(a)**3,y:-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))});
      function size(){
        dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
        for(const c of [garden,trail]){c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px'}
        g.setTransform(dpr,0,0,dpr,0,0);t.setTransform(dpr,0,0,dpr,0,0);
        const mobile=w<=760;heartOrigin=mobile?{x:w*.22,y:h*.25}:{x:w*.245,y:h*.46};heartScale=mobile?Math.min(w,h)*.017:Math.min(w*.026,h*.026);
        dots.length=0;const count=mobile?150:240;
        for(let i=0;i<count;i++){const a=(i/count)*Math.PI*2,p=heartPoint(a),spread=Math.random()*.24+.88;dots.push({x:p.x*heartScale*spread,y:p.y*heartScale*spread,r:.8+Math.random()*2.1,phase:Math.random()*6.28,delay:i/count,color:palette[i%3]})}
        if(!floaters.length)for(let i=0;i<(mobile?18:28);i++)floaters.push(makeFloater(true));
      }
      function makeFloater(initial=false){return{x:Math.random()*w,y:initial?Math.random()*h:h+30,v:.08+Math.random()*.28,s:.8+Math.random()*2.1,a:.08+Math.random()*.2,phase:Math.random()*6.28}}
      function drawHeart(ctx,x,y,s,color,alpha=1,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s/30,s/30);ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-18,-4,-16,-20,-5,-20);ctx.bezierCurveTo(1,-20,5,-16,0,-10);ctx.bezierCurveTo(5,-16,9,-20,15,-20);ctx.bezierCurveTo(26,-20,28,-4,0,18);ctx.closePath();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fill();ctx.restore()}
      function emit(x,y,n=2,burst=false){for(let i=0;i<n;i++){const a=burst?Math.random()*Math.PI*2:-Math.PI/2+(Math.random()-.5)*.8,force=burst?.8+Math.random()*2:.25+Math.random()*.6;sparks.push({x,y,vx:Math.cos(a)*force,vy:Math.sin(a)*force-.15,s:5+Math.random()*9,life:1,fade:.012+Math.random()*.012,rot:(Math.random()-.5)*.8,spin:(Math.random()-.5)*.04,color:palette[Math.floor(Math.random()*palette.length)],heart:Math.random()>.25})}if(sparks.length>420)sparks.splice(0,sparks.length-420)}
      function frame(now){
        const dt=Math.min(32,now-then);then=now;const time=now*.001;g.clearRect(0,0,w,h);g.globalCompositeOperation='lighter';
        for(const f of floaters){f.y-=f.v*dt;f.phase+=.006*dt;if(f.y<-20)Object.assign(f,makeFloater());g.fillStyle=`rgba(245,188,206,${f.a})`;g.beginPath();g.arc(f.x+Math.sin(f.phase)*12,f.y,f.s,0,Math.PI*2);g.fill()}
        const reveal=Math.min(1,Math.max(0,(now-350)/1900));
        for(const d of dots){if(d.delay>reveal)continue;const shimmer=.52+.42*Math.sin(time*1.7+d.phase),beat=1+Math.sin(time*2.15)*.018,x=heartOrigin.x+d.x*beat+Math.sin(time+d.phase)*1.8,y=heartOrigin.y+d.y*beat+Math.cos(time*.8+d.phase)*1.8;g.shadowColor=d.color;g.shadowBlur=8;g.globalAlpha=shimmer;g.fillStyle=d.color;g.beginPath();g.arc(x,y,d.r*(.85+shimmer*.22),0,Math.PI*2);g.fill()}
        g.shadowBlur=0;g.globalAlpha=1;g.globalCompositeOperation='source-over';t.clearRect(0,0,w,h);t.globalCompositeOperation='lighter';
        for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt*.065;s.y+=s.vy*dt*.065;s.vy-=.004*dt;s.rot+=s.spin*dt*.06;s.life-=s.fade*dt*.06;if(s.life<=0){sparks.splice(i,1);continue}t.shadowColor=s.color;t.shadowBlur=11*s.life;if(s.heart)drawHeart(t,s.x,s.y,s.s*(.62+.38*s.life),s.color,s.life,s.rot);else{t.globalAlpha=s.life;t.fillStyle=s.color;t.beginPath();t.arc(s.x,s.y,1.1+s.life*1.1,0,Math.PI*2);t.fill();t.globalAlpha=1}}
        t.shadowBlur=0;t.globalCompositeOperation='source-over';requestAnimationFrame(frame);
      }
      function down(e){active.set(e.pointerId,{x:e.clientX,y:e.clientY});emit(e.clientX,e.clientY,14,true)}
      function move(e){
        if(e.pointerType==='mouse'&&!active.has(e.pointerId)){const prev=active.get('hover')||{x:e.clientX,y:e.clientY},dist=Math.hypot(e.clientX-prev.x,e.clientY-prev.y);if(dist>12){emit(e.clientX,e.clientY,1);active.set('hover',{x:e.clientX,y:e.clientY})}return}
        const p=active.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/8));for(let i=1;i<=steps;i++)emit(p.x+dx*i/steps,p.y+dy*i/steps,i===steps?2:1);active.set(e.pointerId,{x:e.clientX,y:e.clientY});
      }
      function up(e){active.delete(e.pointerId)}
      addEventListener('pointerdown',down,{passive:true});addEventListener('pointermove',move,{passive:true});addEventListener('pointerup',up,{passive:true});addEventListener('pointercancel',up,{passive:true});addEventListener('resize',size,{passive:true});size();requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
