<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f8e9ee">
  <meta name="description" content="给老婆的生日祝福。">
  <title>老婆，生日快乐</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23fff8f4'/%3E%3Cpath d='M32 51S11 39 11 24c0-11 14-15 21-5 7-10 21-6 21 5 0 15-21 27-21 27Z' fill='%23e85f83'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--wine:#8d2948;--rose:#e85f83;--pink:#f6a2b8;--paper:#fffaf6;--ink:#3f2933;--gold:#d5a355;--lilac:#9a82c7}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{min-height:100dvh;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;background:#f7e8ed;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
    body::before{content:"";position:fixed;inset:-8%;z-index:-3;background:radial-gradient(ellipse at 12% 10%,rgba(255,255,255,.96),transparent 26%),radial-gradient(ellipse at 86% 85%,rgba(226,185,219,.52),transparent 31%),linear-gradient(135deg,#fdf4f1 0%,#f5e1e8 52%,#eee6f7 100%);animation:bgDrift 13s ease-in-out infinite alternate}
    body::after{content:"";position:fixed;inset:0;z-index:-2;opacity:.22;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E");mix-blend-mode:multiply}
    canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#ambient{z-index:-1}#trail{z-index:8}
    .page{min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
    .postcard{position:relative;width:min(1120px,94vw);min-height:min(720px,84dvh);display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;background:rgba(255,250,246,.96);border:2px solid #fff;border-radius:36px;box-shadow:13px 15px 0 rgba(206,104,136,.14),0 34px 90px rgba(100,44,67,.18),inset 0 0 0 1px rgba(224,109,141,.12);animation:cardIn .9s cubic-bezier(.2,.8,.3,1) both}
    .postcard::before{content:"";position:absolute;inset:15px;border:1px dashed rgba(181,66,99,.2);border-radius:25px;pointer-events:none}
    .copy{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:clamp(48px,7vw,92px)}
    .eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 20px;color:var(--wine);font-size:.72rem;font-weight:800;letter-spacing:.26em}.eyebrow::before{content:"";width:30px;height:2px;background:var(--rose)}
    h1{margin:0;color:#412633;font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(2.8rem,5.9vw,5.8rem);font-weight:800;line-height:1.12;letter-spacing:.045em}
    h1 em{position:relative;display:inline-block;color:var(--rose);font-style:normal}h1 em::after{content:"";position:absolute;left:-3%;right:-3%;bottom:-7px;height:9px;border-bottom:3px solid #ef98af;border-radius:50%;transform:rotate(-2deg)}
    .sub{margin:27px 0 0;color:#73515f;font-size:clamp(1.08rem,1.9vw,1.35rem);font-weight:600;line-height:2.05;letter-spacing:.07em}.sub strong{color:var(--wine);font-size:1.08em}
    .sign{display:flex;align-items:center;gap:13px;margin-top:clamp(28px,5vh,52px)}.date{margin:0;padding:9px 14px;color:#765260;background:#f4e8ee;border-radius:999px;font:700 .78rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em}.sign i{width:36px;height:1px;background:#d8b8c2}.sign span{color:var(--rose);font:400 22px/1 Georgia,serif;animation:pulse 1.9s ease-in-out infinite}
    .art{position:relative;display:grid;place-items:center;padding:48px 50px 48px 10px}
    .art::before{content:"";position:absolute;width:min(37vw,430px);aspect-ratio:1;border-radius:46% 54% 52% 48%/53% 42% 58% 47%;background:linear-gradient(145deg,#fbe0e8,#f4dce9 52%,#e9e0f5);box-shadow:inset 12px 14px 30px rgba(255,255,255,.75),0 25px 55px rgba(168,82,111,.13);animation:blob 9s ease-in-out infinite alternate}
    .heart-art{position:relative;z-index:1;width:min(38vw,450px);aspect-ratio:1}
    .ring{position:absolute;inset:3%;border:1px solid rgba(141,41,72,.14);border-radius:50%;animation:spin 25s linear infinite}.ring::before,.ring::after{content:"✦";position:absolute;color:var(--gold);text-shadow:0 2px 8px rgba(182,119,30,.18)}.ring::before{left:5%;top:27%;font-size:18px}.ring::after{right:8%;bottom:20%;font-size:11px}
    .heart-outline{position:absolute;inset:9%;filter:drop-shadow(0 18px 22px rgba(157,38,76,.22));animation:float 4.2s ease-in-out infinite}
    .heart-outline canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
    .doodle{position:absolute;z-index:2;padding:7px 11px;color:var(--wine);background:#fff;border:1px solid #f5c6d3;border-radius:999px;box-shadow:0 5px 14px rgba(127,52,78,.1);font-size:.68rem;font-weight:800;letter-spacing:.08em}.doodle.one{right:1%;top:17%;transform:rotate(7deg)}.doodle.two{left:2%;bottom:18%;transform:rotate(-8deg);color:#74578e;border-color:#ddcff3}
    .love-note{position:absolute;z-index:2;left:50%;bottom:9%;transform:translateX(-50%) rotate(-2deg);width:max-content;margin:0;color:#825365;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:.78rem;font-weight:700;letter-spacing:.05em}
    .hint{position:fixed;z-index:7;left:50%;bottom:max(13px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;margin:0;color:rgba(96,57,74,.52);font-size:.68rem;font-weight:700;letter-spacing:.1em;animation:hintOut 8s both;pointer-events:none}
    @keyframes bgDrift{to{transform:translate(-2%,1%) scale(1.04)}}@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}@keyframes blob{to{border-radius:55% 45% 44% 56%/43% 58% 42% 57%;transform:rotate(4deg) scale(1.03)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes heartBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.055)}36%{transform:scale(.99)}}@keyframes pulse{0%,100%{transform:scale(1)}22%{transform:scale(1.2)}40%{transform:scale(.98)}}@keyframes hintOut{0%,10%{opacity:0}18%,72%{opacity:1}100%{opacity:0}}
    @media(max-width:760px){
      .page{padding:max(17px,env(safe-area-inset-top)) 15px max(28px,env(safe-area-inset-bottom))}.postcard{width:100%;min-height:0;height:min(88dvh,720px);display:flex;flex-direction:column-reverse;border-radius:27px;box-shadow:8px 9px 0 rgba(206,104,136,.13),0 22px 55px rgba(100,44,67,.16)}.postcard::before{inset:10px;border-radius:19px}.copy{height:58%;padding:25px 28px 31px;justify-content:flex-start}.eyebrow{margin-bottom:11px;font-size:.6rem}.eyebrow::before{width:20px}h1{font-size:clamp(2.25rem,10.6vw,3.55rem);line-height:1.08}h1 em::after{bottom:-4px;height:5px;border-width:2px}.sub{margin-top:17px;font-size:clamp(.98rem,4vw,1.12rem);line-height:1.78}.sign{margin-top:auto;padding-top:13px}.date{font-size:.68rem;padding:8px 11px}
      .art{height:42%;padding:18px 22px 0}.art::before{width:min(69vw,300px)}.heart-art{width:min(70vw,310px)}.doodle{font-size:.56rem;padding:5px 8px}.doodle.one{right:6%;top:13%}.doodle.two{left:7%;bottom:12%}.love-note{bottom:4%;font-size:.65rem}
    }
    @media(max-height:640px) and (max-width:760px){.postcard{height:92dvh}.art{height:35%}.copy{height:65%;padding-top:18px;padding-bottom:22px}.eyebrow{margin-bottom:7px}h1{font-size:2.05rem}.sub{margin-top:12px;font-size:.92rem;line-height:1.58}.sign{padding-top:8px}.love-note{display:none}.hint{display:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>
  <main class="page">
    <article class="postcard" aria-label="写给老婆的生日祝福">
      <section class="copy">
        <p class="eyebrow">A LITTLE BIRTHDAY NOTE</p>
        <h1>老婆，<br><em>生日快乐！</em></h1>
        <p class="sub"><strong>永远爱你！</strong><br>希望你天天开心，身体健康</p>
        <footer class="sign"><p class="date">2026.10.09</p><i></i><span aria-hidden="true">♥</span></footer>
      </section>
      <section class="art" aria-hidden="true">
        <div class="heart-art">
          <div class="ring"></div>
          <div class="heart-outline"><canvas id="heartCluster"></canvas></div>
          <span class="doodle one">生日限定 ✦</span><span class="doodle two">LOVE YOU</span>
          <p class="love-note">a little love, every day ♡</p>
        </div>
      </section>
    </article>
  </main>
  <p class="hint">轻轻滑动屏幕，留下爱心轨迹</p>
  <canvas id="trail" aria-hidden="true"></canvas>
  <script>
    (()=>{
      const ambient=document.querySelector('#ambient'),trail=document.querySelector('#trail'),a=ambient.getContext('2d'),t=trail.getContext('2d');
      const dust=[],sparks=[],active=new Map(),colors=['#e85f83','#f5a0b6','#d5a355','#9a82c7','#ffffff'];let w=0,h=0,dpr=1,last=performance.now();
      function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;for(const c of[ambient,trail]){c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px'}a.setTransform(dpr,0,0,dpr,0,0);t.setTransform(dpr,0,0,dpr,0,0);if(!dust.length)for(let i=0;i<(w<760?18:30);i++)dust.push(makeDust(true))}
      function makeDust(initial=false){return{x:Math.random()*w,y:initial?Math.random()*h:h+15,v:.05+Math.random()*.18,r:.7+Math.random()*1.7,phase:Math.random()*6.28,alpha:.12+Math.random()*.23,color:colors[Math.floor(Math.random()*4)]}}
      function heart(c,x,y,z,color,alpha=1,rot=0){c.save();c.translate(x,y);c.rotate(rot);c.scale(z/30,z/30);c.beginPath();c.moveTo(0,8);c.bezierCurveTo(-18,-4,-16,-20,-5,-20);c.bezierCurveTo(1,-20,5,-16,0,-10);c.bezierCurveTo(5,-16,9,-20,15,-20);c.bezierCurveTo(26,-20,28,-4,0,18);c.closePath();c.globalAlpha=alpha;c.fillStyle=color;c.fill();c.restore()}
      function emit(x,y,n=2,burst=false){for(let i=0;i<n;i++){const q=burst?Math.random()*Math.PI*2:-Math.PI/2+(Math.random()-.5)*.9,v=burst?.6+Math.random()*1.6:.18+Math.random()*.55;sparks.push({x,y,vx:Math.cos(q)*v,vy:Math.sin(q)*v-.1,z:4+Math.random()*7,life:1,fade:.012+Math.random()*.012,rot:(Math.random()-.5),spin:(Math.random()-.5)*.035,color:colors[Math.floor(Math.random()*colors.length)],heart:Math.random()>.28})}if(sparks.length>360)sparks.splice(0,sparks.length-360)}
      function frame(now){const dt=Math.min(32,now-last);last=now;a.clearRect(0,0,w,h);for(const d of dust){d.y-=d.v*dt;d.phase+=.004*dt;if(d.y<-10)Object.assign(d,makeDust());a.globalAlpha=d.alpha;a.fillStyle=d.color;a.beginPath();a.arc(d.x+Math.sin(d.phase)*9,d.y,d.r,0,Math.PI*2);a.fill()}a.globalAlpha=1;t.clearRect(0,0,w,h);for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx*dt*.065;p.y+=p.vy*dt*.065;p.vy-=.003*dt;p.rot+=p.spin*dt*.06;p.life-=p.fade*dt*.06;if(p.life<=0){sparks.splice(i,1);continue}t.shadowColor=p.color;t.shadowBlur=9*p.life;if(p.heart)heart(t,p.x,p.y,p.z,p.color,p.life,p.rot);else{t.globalAlpha=p.life;t.fillStyle=p.color;t.beginPath();t.arc(p.x,p.y,1.1+p.life,0,Math.PI*2);t.fill();t.globalAlpha=1}}t.shadowBlur=0;requestAnimationFrame(frame)}
      function down(e){active.set(e.pointerId,{x:e.clientX,y:e.clientY});emit(e.clientX,e.clientY,10,true)}function move(e){if(e.pointerType==='mouse'&&!active.has(e.pointerId)){const p=active.get('hover')||{x:e.clientX,y:e.clientY};if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>15){emit(e.clientX,e.clientY,1);active.set('hover',{x:e.clientX,y:e.clientY})}return}const p=active.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/9));for(let i=1;i<=n;i++)emit(p.x+dx*i/n,p.y+dy*i/n,i===n?2:1);active.set(e.pointerId,{x:e.clientX,y:e.clientY})}const up=e=>active.delete(e.pointerId);
      addEventListener('pointerdown',down,{passive:true});addEventListener('pointermove',move,{passive:true});addEventListener('pointerup',up,{passive:true});addEventListener('pointercancel',up,{passive:true});addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame);
    })();
  </script>
  <script>
    (()=>{
      const canvas=document.querySelector('#heartCluster'),ctx=canvas.getContext('2d'),host=canvas.parentElement,points=[];
      let cw=0,ch=0,ratio=1;
      const boundary=q=>({x:16*Math.sin(q)**3/18,y:-(13*Math.cos(q)-5*Math.cos(2*q)-2*Math.cos(3*q)-Math.cos(4*q))/18});
      const pointCount=innerWidth<=760?1100:1650;
      for(let i=0;i<pointCount;i++){
        const q=Math.random()*Math.PI*2,r=Math.sqrt(Math.random()),p=boundary(q),depth=Math.sqrt(Math.max(0,1-r*r));
        points.push({x:p.x*r,y:p.y*r,z:(Math.random()*2-1)*depth*.6+(Math.random()-.5)*.045,size:1.8+Math.random()*2.5,tilt:(Math.random()-.5)*.6,glow:Math.random()>.9});
      }
      function fit(){
        const box=host.getBoundingClientRect();ratio=Math.min(devicePixelRatio||1,2);cw=Math.max(1,box.width);ch=Math.max(1,box.height);canvas.width=cw*ratio;canvas.height=ch*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);
      }
      function miniHeart(x,y,size,color,alpha,rot){
        ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(size/18,size/18);ctx.beginPath();ctx.moveTo(0,5);ctx.bezierCurveTo(-10,-2,-9,-11,-3,-11);ctx.bezierCurveTo(0,-11,2,-9,0,-6);ctx.bezierCurveTo(2,-9,4,-11,8,-11);ctx.bezierCurveTo(14,-11,15,-2,0,10);ctx.closePath();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fill();ctx.restore();
      }
      function render(now){
        ctx.clearRect(0,0,cw,ch);
        const breath=1+.028*Math.sin(now*.0021),kick=Math.pow(Math.max(0,Math.sin(now*.0046)),10)*.035,beat=breath+kick;
        const turn=Math.sin(now*.00038)*.24,ct=Math.cos(turn),st=Math.sin(turn),scale=Math.min(cw,ch)*.465;
        const drawn=points.map(p=>{const x=p.x*ct+p.z*st,z=-p.x*st+p.z*ct,perspective=1/(1-z*.28);return{...p,rx:x,rz:z,px:cw*.5+x*scale*beat*perspective,py:ch*.51+p.y*scale*beat*perspective,perspective}}).sort((m,n)=>m.rz-n.rz);
        const shade=ctx.createRadialGradient(cw*.42,ch*.36,4,cw*.5,ch*.52,Math.min(cw,ch)*.49);shade.addColorStop(0,'rgba(255,255,255,.18)');shade.addColorStop(1,'rgba(123,25,59,0)');ctx.fillStyle=shade;ctx.beginPath();ctx.ellipse(cw*.5,ch*.55,scale*.82,scale*.7,0,0,Math.PI*2);ctx.fill();
        for(const p of drawn){
          const light=Math.max(0,Math.min(1,(p.rz+.65)/1.3)),lum=37+light*30,alpha=.56+light*.42,size=p.size*p.perspective*(.9+light*.22);
          if(p.glow&&light>.62){ctx.shadowColor='rgba(255,173,197,.8)';ctx.shadowBlur=8}else ctx.shadowBlur=0;
          miniHeart(p.px,p.py,size,`hsl(${342+light*5} ${66+light*18}% ${lum}%)`,alpha,p.tilt+turn*.45);
        }
        ctx.shadowBlur=0;requestAnimationFrame(render);
      }
      new ResizeObserver(fit).observe(host);fit();requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
