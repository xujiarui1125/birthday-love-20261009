<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#170816">
  <meta name="description" content="给老婆的生日祝福：生日快乐，永远爱你。">
  <title>老婆，生日快乐</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23170816'/%3E%3Cpath d='M32 52S10 39 10 23c0-12 15-16 22-5 7-11 22-7 22 5 0 16-22 29-22 29Z' fill='%23ff6b9d'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --pink:#ff6b9d; --rose:#ff3e75; --cream:#fff5f7; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body {
      min-height:100dvh;
      color:var(--cream);
      font-family:"Noto Serif SC","Songti SC","STSong",serif;
      background:
        radial-gradient(circle at 50% 32%, rgba(137,36,92,.36), transparent 34%),
        radial-gradient(circle at 14% 88%, rgba(100,42,113,.34), transparent 31%),
        linear-gradient(145deg,#090610 0%,#22091d 48%,#100a21 100%);
      touch-action:none;
      -webkit-tap-highlight-color:transparent;
      user-select:none;
    }
    canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
    #ambient { z-index:0; }
    #trail { z-index:4; }
    .grain {
      position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.16;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode:soft-light;
    }
    .halo {
      position:fixed; width:min(78vw,620px); aspect-ratio:1; left:50%; top:50%; z-index:1;
      transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
      background:radial-gradient(circle,rgba(255,86,145,.2),rgba(255,86,145,.04) 48%,transparent 69%);
      filter:blur(10px); animation:breathe 4.8s ease-in-out infinite;
    }
    main {
      position:relative; z-index:2; width:100%; min-height:100dvh;
      display:grid; place-items:center; padding:max(22px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
    }
    .card {
      position:relative; width:min(90vw,660px); padding:clamp(34px,6vw,66px) clamp(24px,7vw,72px);
      text-align:center; border:1px solid rgba(255,212,225,.28); border-radius:34px;
      background:linear-gradient(155deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
      box-shadow:0 34px 90px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.19), 0 0 70px rgba(255,58,119,.12);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
      overflow:hidden;
    }
    .card::before {
      content:""; position:absolute; width:210px; height:210px; left:-105px; top:-110px; border-radius:50%;
      background:rgba(255,89,148,.17); filter:blur(22px);
    }
    .eyebrow { margin:0 0 16px; font:500 .82rem/1.4 system-ui,sans-serif; letter-spacing:.34em; color:#ffd0df; text-transform:uppercase; }
    .heart-mark {
      display:inline-grid; place-items:center; width:76px; height:76px; margin:0 auto 17px;
      font:400 52px/1 Georgia,serif; color:#ff7aa9; text-shadow:0 0 18px rgba(255,91,147,.8),0 0 44px rgba(255,52,119,.48);
      animation:heartbeat 1.7s ease-in-out infinite;
    }
    h1 { margin:0; font-size:clamp(2.1rem,8vw,4.4rem); line-height:1.18; font-weight:700; letter-spacing:.08em; text-shadow:0 3px 24px rgba(0,0,0,.42); }
    .divider { display:flex; align-items:center; justify-content:center; gap:12px; margin:23px auto; color:#ff8eb5; }
    .divider::before,.divider::after { content:""; width:52px; height:1px; background:linear-gradient(90deg,transparent,rgba(255,178,204,.72)); }
    .divider::after { transform:scaleX(-1); }
    .message { margin:0 auto; max-width:490px; font-size:clamp(1.08rem,3.8vw,1.4rem); line-height:2; letter-spacing:.08em; color:#ffe8ef; }
    .promise { display:block; color:#ffb5cd; font-size:1.08em; }
    .date { margin:26px 0 0; font:500 .92rem/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.18em; color:rgba(255,232,239,.72); }
    .hint { position:fixed; z-index:3; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); margin:0; white-space:nowrap; font:400 .76rem/1.4 system-ui,sans-serif; letter-spacing:.12em; color:rgba(255,222,233,.58); animation:fadeHint 7s both; pointer-events:none; }
    @keyframes heartbeat { 0%,100%{transform:scale(1)} 12%{transform:scale(1.17)} 25%{transform:scale(.98)} 38%{transform:scale(1.12)} 58%{transform:scale(1)} }
    @keyframes breathe { 0%,100%{transform:translate(-50%,-50%) scale(.94);opacity:.72} 50%{transform:translate(-50%,-50%) scale(1.08);opacity:1} }
    @keyframes fadeHint { 0%,12%{opacity:0} 22%,75%{opacity:1} 100%{opacity:0} }
    @media (max-height:650px) { .card{padding-top:25px;padding-bottom:25px} .heart-mark{height:54px;margin-bottom:8px;font-size:42px}.divider{margin:14px auto}.date{margin-top:14px} }
    @media (prefers-reduced-motion:reduce) { .heart-mark,.halo{animation:none} }
  </style>
</head>
<body>
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="halo" aria-hidden="true"></div>
  <main>
    <article class="card" aria-label="生日祝福">
      <p class="eyebrow">Happy Birthday · My Love</p>
      <div class="heart-mark" aria-hidden="true">♥</div>
      <h1>老婆，生日快乐！</h1>
      <div class="divider" aria-hidden="true">✦</div>
      <p class="message">
        <span class="promise">永远爱你！</span>
        希望你天天开心，身体健康
      </p>
      <p class="date">2026.10.09</p>
    </article>
  </main>
  <p class="hint">用指尖轻轻划过 · 留下一路心动</p>
  <canvas id="trail" aria-hidden="true"></canvas>
  <script>
    (() => {
      const ambient = document.querySelector('#ambient');
      const trail = document.querySelector('#trail');
      const ac = ambient.getContext('2d');
      const tc = trail.getContext('2d');
      let w=0,h=0,dpr=1,last=performance.now();
      const floaters=[], sparks=[];
      const pointers=new Map();
      const colors=['#ff4f87','#ff79a7','#ffc1d5','#fff0f5','#d889ff'];

      function resize(){
        dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
        for(const c of [ambient,trail]){ c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px'; }
        ac.setTransform(dpr,0,0,dpr,0,0); tc.setTransform(dpr,0,0,dpr,0,0);
        if(!floaters.length) for(let i=0;i<Math.min(42,Math.max(20,Math.floor(w*h/24000)));i++) floaters.push(makeFloater(true));
      }
      function makeFloater(initial=false){
        return {x:Math.random()*w,y:initial?Math.random()*h:h+30,size:5+Math.random()*14,speed:.16+Math.random()*.48,sway:Math.random()*6.28,alpha:.08+Math.random()*.28,rot:Math.random()*6.28};
      }
      function heart(ctx,x,y,size,color,alpha=1,rotation=0){
        ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(size/30,size/30);
        ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-18,-4,-16,-20,-5,-20);ctx.bezierCurveTo(1,-20,5,-16,0,-10);ctx.bezierCurveTo(5,-16,9,-20,15,-20);ctx.bezierCurveTo(26,-20,28,-4,0,18);ctx.closePath();
        ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fill();ctx.restore();
      }
      function spawn(x,y,count=2){
        for(let i=0;i<count;i++) sparks.push({x:x+(Math.random()-.5)*5,y:y+(Math.random()-.5)*5,vx:(Math.random()-.5)*.7,vy:-.35-Math.random()*.9,size:7+Math.random()*11,life:1,decay:.012+Math.random()*.012,color:colors[Math.floor(Math.random()*colors.length)],rot:(Math.random()-.5)*.8,spin:(Math.random()-.5)*.035});
        if(sparks.length>360) sparks.splice(0,sparks.length-360);
      }
      function draw(now){
        const dt=Math.min(32,now-last);last=now;
        ac.clearRect(0,0,w,h);
        for(const f of floaters){
          f.y-=f.speed*dt/16; f.sway+=.009*dt/16; f.rot+=.002*dt/16;
          if(f.y < -35) Object.assign(f,makeFloater());
          heart(ac,f.x+Math.sin(f.sway)*14,f.y,f.size,'#ff91b7',f.alpha,f.rot);
        }
        tc.clearRect(0,0,w,h);
        tc.globalCompositeOperation='lighter';
        for(let i=sparks.length-1;i>=0;i--){
          const s=sparks[i];s.x+=s.vx*dt/16;s.y+=s.vy*dt/16;s.vy-=.008*dt/16;s.rot+=s.spin*dt/16;s.life-=s.decay*dt/16;
          if(s.life<=0){sparks.splice(i,1);continue}
          tc.shadowColor=s.color;tc.shadowBlur=14*s.life;
          heart(tc,s.x,s.y,s.size*(.65+.35*s.life),s.color,Math.max(0,s.life),s.rot);
        }
        tc.shadowBlur=0;tc.globalCompositeOperation='source-over';requestAnimationFrame(draw);
      }
      function move(e){
        if(e.pointerType==='mouse' && e.buttons===0 && !pointers.has(e.pointerId)) return;
        const prev=pointers.get(e.pointerId)||{x:e.clientX,y:e.clientY};
        const dx=e.clientX-prev.x,dy=e.clientY-prev.y,dist=Math.hypot(dx,dy),step=9;
        const n=Math.max(1,Math.ceil(dist/step));
        for(let i=1;i<=n;i++) spawn(prev.x+dx*i/n,prev.y+dy*i/n,i===n?2:1);
        pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      }
      addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});spawn(e.clientX,e.clientY,8);},{passive:true});
      addEventListener('pointermove',move,{passive:true});
      for(const type of ['pointerup','pointercancel','pointerout']) addEventListener(type,e=>pointers.delete(e.pointerId),{passive:true});
      addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
